name: Build and Release Antigravity APKs

on:
  push:
    tags:
      - 'v*'
    branches:
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag; must match APP_VERSION_NAME (for example v2.3.0)'
        type: string
        required: false
        default: ''
      publish_release:
        description: 'Build and publish signed release APKs instead of a dev APK'
        type: boolean
        default: false
      draft:
        description: 'Create a draft GitHub release'
        type: boolean
        default: false
      prerelease:
        description: 'Mark the GitHub release as a pre-release'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: Offline tests and build invariants
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run tests and invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s patches/tests -v
          python3 -m unittest discover -s build/tests -v
          bash build/tests/selftest.sh
          bash bus/selftest
          bash build.sh --dry-run
          bash env/tests/selftest
          bash web/tests/selftest.sh
          openssl x509 -in app/src/main/res/raw/agy_core_cert.pem -noout -subject
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          ASSETS="$tmp/env" bash env/build.sh all
          ASSETS="$tmp/env" bash env/tests/invariant
          for script in build.sh build/lib/*.sh build/phases/*.sh \
                        env/build.sh web/build.sh build/tests/selftest.sh \
                        web/tests/selftest.sh bus/selftest; do
            bash -n "$script"
          done

  build-dev:
    name: Build development APK
    needs: test
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && !inputs.publish_release)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Build dev APK
        run: bash build.sh --dev

      - name: Upload dev APK
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-dev-apk
          path: dist/antigravity-dev.apk
          if-no-files-found: error
          retention-days: 14

  build-release:
    name: Build signed release APKs
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate release tag against app version
        env:
          RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}
        run: python3 build/tools/validate_release_tag.py "$RELEASE_TAG" config/app.env

      - name: Install Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y aapt zipalign apksigner file zip unzip gzip

      - name: Prepare protected release keystore
        env:
          AGY_RELEASE_KEYSTORE_B64: ${{ secrets.AGY_RELEASE_KEYSTORE_B64 }}
          AGY_RELEASE_KEY_ALIAS: ${{ secrets.AGY_RELEASE_KEY_ALIAS }}
          AGY_RELEASE_STORE_PASS: ${{ secrets.AGY_RELEASE_STORE_PASS }}
          AGY_RELEASE_KEY_PASS: ${{ secrets.AGY_RELEASE_KEY_PASS }}
          AGY_RELEASE_CERT_SHA256: ${{ secrets.AGY_RELEASE_CERT_SHA256 }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AGY_RELEASE_KEYSTORE_B64 AGY_RELEASE_KEY_ALIAS \
                      AGY_RELEASE_STORE_PASS AGY_RELEASE_KEY_PASS \
                      AGY_RELEASE_CERT_SHA256; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required GitHub Actions secret: $name" >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/agy-release.keystore"
          printf '%s' "$AGY_RELEASE_KEYSTORE_B64" | base64 --decode > "$keystore"
          test -s "$keystore"
          chmod 600 "$keystore"
          keytool -list -keystore "$keystore" \
            -storepass "$AGY_RELEASE_STORE_PASS" \
            -alias "$AGY_RELEASE_KEY_ALIAS" >/dev/null
          expected="${AGY_RELEASE_CERT_SHA256//:/}"
          expected="${expected,,}"
          if [[ ! "$expected" =~ ^[0-9a-f]{64}$ ]]; then
            echo "AGY_RELEASE_CERT_SHA256 must be a SHA-256 certificate fingerprint." >&2
            exit 1
          fi
          actual="$(keytool -exportcert -keystore "$keystore" \
            -storepass "$AGY_RELEASE_STORE_PASS" \
            -alias "$AGY_RELEASE_KEY_ALIAS" | sha256sum)"
          actual="${actual%% *}"
          actual="${actual,,}"
          if [[ "$actual" != "$expected" ]]; then
            echo "Release signing certificate does not match AGY_RELEASE_CERT_SHA256." >&2
            echo "Check the intended update-signing identity before publishing." >&2
            exit 1
          fi
          echo "Release signing certificate fingerprint verified."

      - name: Build standard and region-bypass APKs
        env:
          AGY_RELEASE_KEYSTORE: ${{ runner.temp }}/agy-release.keystore
          AGY_RELEASE_KEY_ALIAS: ${{ secrets.AGY_RELEASE_KEY_ALIAS }}
          AGY_RELEASE_STORE_PASS: ${{ secrets.AGY_RELEASE_STORE_PASS }}
          AGY_RELEASE_KEY_PASS: ${{ secrets.AGY_RELEASE_KEY_PASS }}
        run: |
          set -euo pipefail
          bash build.sh
          bash build.sh --region-bypass

      - name: Compute checksums
        run: |
          cd dist
          sha256sum antigravity.apk antigravity-bypass.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload release APKs
        uses: actions/upload-artifact@v4
        with:
          name: antigravity-release-apks
          path: |
            dist/antigravity.apk
            dist/antigravity-bypass.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: antigravity-release-apks
          path: dist

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Antigravity for Android ${{ inputs.tag_name || github.ref_name }}
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/antigravity.apk
            dist/antigravity-bypass.apk
            dist/SHA256SUMS.txt
          body: |
            Release tag and Android app version are validated against `config/app.env`.

            | File | Description |
            | --- | --- |
            | `antigravity.apk` | Standard production build |
            | `antigravity-bypass.apk` | Region-bypass production build |
            | `SHA256SUMS.txt` | SHA-256 checksums |

            Both APKs are signed with the protected release keystore. Preserve that signing identity for future updates.
